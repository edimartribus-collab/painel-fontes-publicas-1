# Roda o coletor todo dia 1 do mes as 9h UTC (6h em Goiania) e publica sozinho.
# Tambem da para disparar na mao: aba Actions do repositorio, Run workflow.
name: Atualizar dados do painel
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python coletor.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          git commit -m "dados: atualizacao automatica" || echo "nada mudou"
          git push
